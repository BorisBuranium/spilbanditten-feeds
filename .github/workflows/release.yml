# Laver en udgivelse. Plugin'et på spilbanditten.dk installerer kun udgivelser.
# Start: push et tag som v1.6.1, eller kør Action'en manuelt med versionen (tagget oprettes så af Action'en).
# Versionen skal passe med "Version:" i spilbanditten-feeds.php.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version uden v, fx 1.6.1'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tjek at tag og Version passer
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v=$(sed -n 's/^ \* Version: *//p' spilbanditten-feeds.php | head -1)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then tag="v$INPUT_VERSION"; else tag="$GITHUB_REF_NAME"; fi
          test "v$v" = "$tag" || { echo "Tag $tag passer ikke med Version: $v"; exit 1; }
          php -l spilbanditten-feeds.php
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Byg zip og json
        run: |
          mkdir -p ud/spilbanditten-feeds
          cp spilbanditten-feeds.php ud/spilbanditten-feeds/
          (cd ud && zip -qr spilbanditten-feeds.zip spilbanditten-feeds)
          printf '{"version": "%s"}\n' "$VERSION" > ud/spilbanditten-feeds.json
      - name: Udgiv
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" ud/spilbanditten-feeds.zip ud/spilbanditten-feeds.json --title "$TAG" --notes "Spilbanditten Feeds $VERSION" --target "$GITHUB_SHA"
